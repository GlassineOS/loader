[package]
name = "glassine-test-kernel"
description = "A stand-in kernel for the QEMU tests: prints its command line and initrd sum"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "glassine-test-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
uefi = { version = "=0.41.0", default-features = false, features = ["alloc", "global_allocator"] }
uefi-raw = "=0.17.0"
sha2 = { version = "0.10", default-features = false }
