[workspace]
members = ["core", "loader", "tests/stub", "tests/parent", "tools/gspl-encode"]
exclude = ["tests/mkboot"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.dev]
panic = "abort"
